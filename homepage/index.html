<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>41543117 個人作業展示網頁</title>
    <!-- 引入 Plotly.js 統計圖表套件 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        /* CSS 樣式與 RWD 響應式設計 (滿足第 2, 5 項) */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .chart-container {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .friends-links {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .friends-links ul {
            list-style-type: none;
            padding: 0;
        }
        .friends-links li {
            margin: 8px 0;
        }
        .friends-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .friends-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>41543117</h1>

    <!-- 照片展示區 -->
    <section>
        <img src="Slide1.jpg" alt="螢幕擷取">
        <img src="1790838871342.jpg" alt="主圖">
        
        <h2>他到底在講什麼天書?</h2>
        <img src="images.jpg" alt="示意圖1">

        <p>佐佐木淳平?「人類有三大欲求......分別是食慾、性欲、睡眠欲......」。</p>
        <img src="images1.jpg" alt="示意圖2">
    </section>

    <!-- YouTube 響應式影片區塊 -->
    <section>
        <h2>精選影片</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
    </section>

    <!-- Plotly 圖表容器 -->
    <section>
        <h2>全球葡萄酒產量統計圖 (JavaScript Plotly.js)</h2>
        <div id="myPlot" class="chart-container"></div>
    </section>

    <!-- 同學網站連結區塊 (滿足第 7 項) -->
    <section class="friends-links">
        <h2>班上同學網站連結</h2>
        <ul>
            <!-- 請將以下的 URL 替換成你班上三位同學實際架設的網站網址 -->
            <li>同學 1 網站：<a href="https://example1.com" target="_blank">同學 A 的網站 (點此前往)</a></li>
            <li>同學 2 網站：<a href="https://example2.com" target="_blank">同學 B 的網站 (點此前往)</a></li>
            <li>同學 3 網站：<a href="https://example3.com" target="_blank">同學 C 的網站 (點此前往)</a></li>
        </ul>
    </section>

    <script>
        const xArray = ["Italy", "France", "Spain", "USA", "Argentina"];
        const yArray = [55, 49, 44, 24, 15];

        const data = [{
          x: xArray,
          y: yArray,
          type: "bar",
          orientation: "v",
          marker: {color: "rgba(52, 152, 219, 0.8)"}
        }];

        const layout = {title: "World Wide Wine Production"};

        Plotly.newPlot("myPlot", data, layout);
    </script>

</body>
</html>
